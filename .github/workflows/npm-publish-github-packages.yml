# Publishes the package to GitHub Packages when a release is published.

name: Publish GitHub Package

on:
  release:
    types: [published]

jobs:
  publish-gpr:
    # if: ${{ github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI_TOKEN
        env:
          CI_TOKEN: ${{secrets.CI_TOKEN}}
        run: |
          if [ -z "$CI_TOKEN" ]; then
            echo "::error::Missing required secret CI_TOKEN. Configure it in repository secrets before publishing."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm run check:package
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.CI_TOKEN}}
